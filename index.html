</script><script>
const slides=JSON.parse(document.getElementById('slideData').textContent);const $=id=>document.getElementById(id);let current=0,notesShown=false,overviewShown=false;
const escapeHtml=t=>String(t).replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;');
function content(s){const d=s.data;let h='';switch(s.kind){
case 'cover':return `<div class="kicker-pill">História • Computação • Sociedade</div><h1>${escapeHtml(s.title)}</h1><p class="cover-sub">${escapeHtml(d.subtitle)}</p>${d.line?`<div class="cover-line">${escapeHtml(d.line)}</div>`:''}`;
case 'coverSection':return `<div class="bigFact"><div class="factStat"><strong>${escapeHtml(d.number)}</strong><span>Parte do seminário</span></div><div class="factText"><p>${escapeHtml(d.subtitle)}</p></div></div>`;
case 'question':return `<div class="questionBox"><strong>${escapeHtml(d.question)}</strong><div class="smallNote">${escapeHtml(d.small)}</div></div>`;
case 'cards':return `<div class="cards" style="--cols:${d.items.length===4?4:3}">${d.items.map(x=>`<div class="card"><div class="num">${escapeHtml(x[0])}</div><h2>${escapeHtml(x[1])}</h2><p>${escapeHtml(x[2])}</p></div>`).join('')}</div>`;
case 'timeline':return `<div class="timeline">${d.items.map(x=>`<div class="timeBlock"><div class="time">${escapeHtml(x[0])}</div><h3>${escapeHtml(x[1])}</h3><p>${escapeHtml(x[2])}</p></div>`).join('')}</div>`;
case 'split':return `<div class="split"><div class="side"><h3>${escapeHtml(d.left[0])}</h3><p>${escapeHtml(d.left[1])}</p></div><div class="side"><h3>${escapeHtml(d.right[0])}</h3><p>${escapeHtml(d.right[1])}</p></div></div><div class="under">${escapeHtml(d.bottom)}</div>`;
case 'definition':return `<div class="definition"><div class="defBig"><strong>${escapeHtml(d.term)}</strong><p>${escapeHtml(d.definition)}</p></div><div class="defExamples">${d.examples.map(x=>`<p>↗ ${escapeHtml(x)}</p>`).join('')}</div></div>`;
case 'statement':return `<div class="statement"><strong>${escapeHtml(d.main)}</strong><p>${escapeHtml(d.detail)}</p></div>`;
case 'flow':return `<div class="flow">${d.steps.map((x,i)=>`${i?'<span class="arrow">→</span>':''}<div class="flowStep"><h3>${escapeHtml(x[0])}</h3><p>${escapeHtml(x[1])}</p></div>`).join('')}</div>`;
case 'comparison':return `<div class="compare">${[d.a,d.b].map(x=>`<div class="comp"><div><h3>${escapeHtml(x[0])}</h3><p>${escapeHtml(x[1])}</p></div><small>${escapeHtml(x[2])}</small></div>`).join('')}</div>`;
case 'steps':return `<div class="steps">${d.items.map(x=>`<div class="step"><span>${escapeHtml(x[0])}</span><h3>${escapeHtml(x[1])}</h3>${x[2]?`<p>${escapeHtml(x[2])}</p>`:''}</div>`).join('')}</div>${d.footer?`<div class="stepsFooter">${escapeHtml(d.footer)}</div>`:''}`;
case 'scenario':return `<div class="scenario"><div class="scenarioLabel"><small>Exemplo / situação</small><strong>${escapeHtml(d.label)}</strong></div><div class="scenarioBody"><p>${escapeHtml(d.context)}</p><p>${escapeHtml(d.outcome)}</p></div></div>`;
case 'bars':return `<div class="barPlot">${d.items.map(x=>`<div class="barLine"><div class="barLabel">${escapeHtml(x[0])}</div><div class="barTrack"><div class="barFill" style="width:${Math.max(0,Math.min(100,x[1]))}%"></div></div><div class="barNum">${String(x[1]).replace('.',',')}${escapeHtml(d.suffix)}</div></div>`).join('')}</div><div class="barLegend">${escapeHtml(d.legend)}</div>`;
case 'matrix':return `<div class="matrix">${d.items.map(x=>`<div class="matrixCell"><b>${escapeHtml(x[0])}</b><p>${escapeHtml(x[1])}</p></div>`).join('')}</div>`;

case 'refs':return `<div class="refs">${d.items.map(x=>`<a href="${escapeHtml(x[1])}" target="_blank" rel="noopener noreferrer">↗ ${escapeHtml(x[0])}</a>`).join('')}</div>`;

function markup(s,i){return `<div class="meta"><span>PARTE ${s.section} · ${escapeHtml(s.kicker)}</span></div>${s.kind==='cover'?'':`<h1>${escapeHtml(s.title)}</h1>`}<div class="visual">${content(s)}</div>${s.source?`<div class="source">Fonte: <a href="${escapeHtml(s.source)}" target="_blank" rel="noopener noreferrer">consultar estudo original ↗</a> · dados históricos/contextualizados</div>`:''}<div class="footer"><span>Racismo epistêmico & computação</span><span class="small">${i+1} / ${slides.length}${i===slides.length-1?' · leitura complementar':''}</span></div>`}

function go(n){current=(n+slides.length)%slides.length;overviewShown=false;$('app').classList.remove('overviewMode');render()}
function overview(){overviewShown=!overviewShown;$('app').classList.toggle('overviewMode',overviewShown);if(overviewShown){$('overview').innerHTML=slides.map((s,i)=>`<button data-to="${i}"><small>${String(i+1).padStart(2,'0')} · ${escapeHtml(s.kicker)}</small><strong>${escapeHtml(s.title)}</strong></button>`).join('');$('overview').querySelectorAll('button').forEach(b=>b.onclick=()=>go(Number(b.dataset.to)))}}
$('prevBtn').onclick=()=>go(current-1);$('nextBtn').onclick=()=>go(current+1);$('overviewBtn').onclick=overview;$('notesBtn').onclick=()=>{notesShown=!notesShown;render()};$('fullBtn').onclick=()=>document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen?.();$('printBtn').onclick=()=>{const all=document.createElement('div');all.id='printAll';all.innerHTML=slides.map((s,i)=>`<div class="slide section${s.section} ${s.kind==='cover'?'cover':''}">${markup(s,i)}</div>`).join('');document.body.append(all);const style=document.createElement('style');style.id='printCSS';style.textContent='@media screen{#printAll{display:none}}@media print{#app{display:none!important}#printAll{display:block!important}}';document.head.append(style);window.print();setTimeout(()=>{all.remove();style.remove()},1000)};
document.addEventListener('keydown',e=>{if(['INPUT','TEXTAREA'].includes(document.activeElement.tagName))return;if(['ArrowRight','PageDown',' '].includes(e.key)){e.preventDefault();go(current+1)}else if(['ArrowLeft','PageUp'].includes(e.key)){e.preventDefault();go(current-1)}else if(e.key.toLowerCase()==='o')overview();else if(e.key.toLowerCase()==='n'){notesShown=!notesShown;render()}else if(e.key.toLowerCase()==='f')$('fullBtn').click();else if(e.key==='Home')go(0);else if(e.key==='End')go(slides.length-1);else if(e.key==='Escape'&&overviewShown)overview()});const m=location.hash.match(/slide-(\d+)/);if(m)current=Math.max(0,Math.min(slides.length-1,Number(m[1])-1));render();
